# Local Postgres for development. Production uses Neon (see .env.example).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nonfictional
      POSTGRES_PASSWORD: nonfictional
      POSTGRES_DB: nonfictional
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
