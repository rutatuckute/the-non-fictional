backend:
  name: git-gateway
  branch: master
  repo: rutatuckute/the-non-fictional

# Media lives in the repo and is resized on demand by Netlify's Image CDN,
# so uploads are ordinary git commits and there is no third-party media service.
media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    path: '{{title}}/index'
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "blog"}
      - {label: "Template", name: "template", widget: "hidden", default: "blog-post"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Category", name: "category", widget: "string"}
      - {label: "Category Id", name: "category_id", widget: "string"}
      - {label: "Topics", name: "topic", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list"}
      - {label: "Link", name: "link", widget: "string"}
      - {label: "Excerpt", name: "excerpt", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "Cover Image", name: "cover_image", widget: "image", required: true}
  - name: "photography"
    label: "Photography"
    folder: "content/photography"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "photography"}
      - {label: "Template", name: "template", widget: "hidden", default: "photo-post"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Location", name: "location", widget: "string"}
      - {label: "Year", name: "year", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list"}
      # Drives the type chips on the photography page. A frame saved without one
      # shows in the contact sheet but matches no type filter.
      - label: "Type"
        name: "type"
        widget: "select"
        options: ["portraits", "strangers", "scenes", "lights"]
        required: true
      # Frames sharing a series slug are grouped in the Series view. Leave empty
      # for a standalone frame.
      - {label: "Series", name: "series", widget: "string", required: false}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "Photo", name: "photo", widget: "image", required: true}