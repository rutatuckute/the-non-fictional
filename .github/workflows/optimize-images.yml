name: Optimize images

# Uploads made through /admin are committed by the CMS, so nothing local ever
# runs on them and a full-size camera file would otherwise be committed at full
# size. This normalises whatever arrives and commits the result back.
#
# It runs on the pull request rather than on master for two reasons: master
# requires a pull request and grants no bypass, so a push straight to it would
# be rejected; and fixing the file before the branch is merged keeps the
# oversized blob out of master's history entirely rather than rewriting it after
# the fact.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "static/images/uploads/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    # A fork's token is read-only, so the push below could not succeed.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR's own branch, not the merge commit, so the commit
          # below lands somewhere that can actually be pushed.
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The script imports nothing but sharp, so there is no reason to install
      # the whole Gatsby toolchain here.
      - name: Install sharp
        run: npm install --no-save sharp@0.32.6

      - name: Optimize
        run: npm run images:optimize

      - name: Commit any changes
        run: |
          if git diff --quiet -- static/images/uploads; then
            echo "Nothing to optimise."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/images/uploads
          git commit -m "Optimise uploaded images"
          git push origin HEAD:${{ github.head_ref }}
