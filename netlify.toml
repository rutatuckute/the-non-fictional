[build]
# Do not clean. The clean was the cause.
#
# The build log for 2b8d681 shows the sequence: `gatsby clean` deletes .cache
# and public, and three seconds later, inside `gatsby build`, the Netlify
# adapter restores a Gatsby cache — "Found a Gatsby cache. We're about to go
# FAST." Gatsby then builds incrementally against it and rebuilds 2 of 15
# pages. The two that changed get the new stylesheet; the thirteen it skipped
# keep cached HTML naming the previous one, while the CSS itself is rebuilt
# under a new hash because the source changed. Thirteen pages then link a
# stylesheet this build never emitted.
#
# That is the failure this site has had since August, and `gatsby clean` was
# added in a68b6d4 to fix it. It made it: deleting the cache and then having
# one restored mid-build is what leaves Gatsby's incremental state
# inconsistent. Left alone, the adapter's cache is coherent and Gatsby
# rebuilds the HTML when the stylesheet hash moves.
#
# verify:build stays in front of the deploy either way. It is what caught
# this, by refusing to publish rather than serving thirteen stale pages.
command = "npm run build && npm run verify:build"
publish = "public"

[build.environment]
  NODE_VERSION = "20"