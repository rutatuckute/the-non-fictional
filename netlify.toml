[build]
# Clean first, then check the result.
#
# This site has three times published a build whose HTML pointed at an earlier
# build's stylesheet — the correct CSS present in the deploy, nothing failing,
# and the pages rendering the previous design. Twice on production, once on a
# pull request preview, where it survived two consecutive builds including one
# from an empty commit. `gatsby clean` does remove public/, verified, so
# whatever restores the old file does it somewhere outside this repository.
#
# The clean stays because it is cheap, about 24s, and rules out the obvious
# cause. verify:build covers the rest: a clean build emits exactly one
# stylesheet and every page links it, so anything else fails the deploy here
# rather than going out green and serving the wrong CSS.
# `gatsby clean` is not enough here. It removes public/ locally — verified by
# planting a file and watching it go — but a Netlify build with it in front
# still reached verify:build with three stylesheets in public/: the one it had
# just emitted, plus two from earlier deploys. So the directory is removed
# explicitly as well, and the check that follows is what proves it worked.
#
# TEMPORARY: still --report-only for one more build, to confirm the rm fixes
# the count. Back to failing the build after that.
command = "npm run clean && rm -rf public .cache && npm run build && npm run verify:build -- --report-only"
publish = "public"

[build.environment]
  NODE_VERSION = "20"